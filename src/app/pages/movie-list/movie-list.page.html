<ion-header [translucent]="true">
  <ion-toolbar class="degradado">
    <ion-buttons slot="start">
      <ion-menu-button >⚯ ͛</ion-menu-button>
    </ion-buttons>
    <ion-title slot="start">PELICULAS </ion-title>
  </ion-toolbar>

  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button routerLink="/">Inicio</ion-button>
      <ion-icon name="chevron-forward-outline"></ion-icon>
      <ion-button routerLink="/peliculas" color="primary">Películas</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

  <ion-list *ngIf="!isLoading">
    <ion-item *ngFor="let movie of movies">
      <ion-label>
        <h2>{{ movie.title }}</h2>
        <p><strong>Directores:</strong> {{ movie.directors?.join(', ') }}</p>
        <p><strong>Duración:</strong> {{ movie.runtime }} minutos</p>
        <p><strong>Año:</strong> {{ movie.year }}</p>
        <p><strong>Sinopsis:</strong> {{ movie.plot }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="!isLoading && movies.length === 0">
    <p>No se encontraron películas.</p>
  </div>
</ion-content>
