<ion-header [translucent]="true">
  <ion-toolbar class="degradado">
    <ion-buttons slot="start">
      <ion-menu-button >⚯ ͛</ion-menu-button>
    </ion-buttons>
    <ion-title slot="start">ESTUDIANTES </ion-title>
  </ion-toolbar>

  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button routerLink="/">Inicio</ion-button>
      <ion-icon name="chevron-forward-outline"></ion-icon>
      <ion-button routerLink="/estudiantes" color="primary">Estudiantes</ion-button>
    </ion-buttons>
    <ion-chip>
      <ion-avatar>
        <img alt="Silhouette of a person's head" src="https://masterbundles.com/wp-content/uploads/edd/2023/03/harry-potter-clipart-free-example-image-143-300x300.png" />
      </ion-avatar>
      <ion-label>Estudiantes</ion-label>
      <ion-icon name="close-circle"></ion-icon>
    </ion-chip>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

  <ion-list *ngIf="!isLoading">
    <ion-item *ngFor="let student of students">
      <ion-thumbnail slot="start" *ngIf="student.image">
        <img [src]="student.image" [alt]="student.name">
      </ion-thumbnail>
      <ion-label>
        <h2>{{ student.name }}</h2>
        <p>Casa: {{ student.house || 'No especificada' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="!isLoading && students.length === 0">
    <p>No hay estudiantes disponibles.</p>
  </div>
</ion-content>
