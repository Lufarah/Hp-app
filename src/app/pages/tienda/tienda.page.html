<ion-header>
  <ion-toolbar class="degradado">
    <ion-title>Tienda</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/carrito">
        <ion-icon name="cart"></ion-icon>
        <ion-menu-button slot="start">⚯ ͛</ion-menu-button>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-thumbnail slot="start">
        <img [src]="product.image" alt="{{ product.name }}">
      </ion-thumbnail>
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>${{ product.price }}</p>
      </ion-label>
      <ion-button (click)="addToCart(product)" color="primary">
        Añadir al carrito
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
